name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSO_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: dotnet build validator/Validate.csproj -c Release
      - name: Render oracle for the payment-geometry test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation
      - run: go vet ./...
      - run: go test -race ./...
      - name: Fuzz the page model and Word writer
        run: go test -run '^$' -fuzz FuzzPageModel -fuzztime 20s .
